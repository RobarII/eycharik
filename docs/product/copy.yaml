# Тексты продукта, ревьюятся вместе с answer-policy.md. Код загружает этот файл; в промпт он не встраивается.
escalation:
  no_sources: >-
    Не нашёл ответа в базе знаний. Передал вопрос HR — ответят в течение рабочего дня.
    Если нужно срочно, спросите наставника.
  low_confidence: >-
    Не уверен, что понял вопрос правильно. Передал HR, чтобы вам ответил человек.
  restricted: >-
    Это личный вопрос, такие темы решает HR. Передал ваше обращение, ответят в течение рабочего дня.
  out_of_scope: >-
    Это вне моей зоны: я помогаю с адаптацией и процессами компании. Передал вопрос HR.
  timeout: >-
    Передал ваш вопрос рекрутеру: он свяжется с вами в ближайшее время.
  unavailable: >-
    Сейчас не могу ответить — передал вопрос HR, ответят в течение рабочего дня.
  manual: >-
    Передал вопрос HR вручную — с вами свяжется рекрутер в течение рабочего дня.
reminder_prefix: "Напоминаем: "
reminder_soft: "Шаг «{title}» ждёт ответа. Если уже сделали — напишите «готово», я засчитаю."
reminder_soft_button: "Шаг «{title}» ждёт ответа: выберите вариант кнопкой под сообщением."
completion: >-
  Адаптация завершена. Если останутся вопросы — я на связи, а HR поможет с личными темами.
help: >-
  Я помогаю с адаптацией: подскажу текущий шаг, объясню процедуры и найду ответ в базе знаний.
  /start — повторить текущий шаг, /help — эта справка. Вопрос можно написать обычным текстом;
  личные вопросы я передам HR.
help_demo: >-
  Демо-режим: /nextStage — следующий этап без ожидания, /reboot — начать знакомство заново.
unknown_command: >-
  Неизвестная команда. /start — повторить текущий шаг, /help — справка.
  Вопрос можно написать обычным текстом.
ask_question: >-
  Напишите вопрос — я передам его HR, если не смогу ответить по базе знаний.
no_next_stage: >-
  Следующего этапа нет: сценарий завершён. Если нужен новый прогон, отправьте /reboot.
stage_scheduled: >-
  Следующий этап — «{stage}» — запланирован на {when}.
stage_waiting: >-
  Следующий этап — «{stage}» — запланирован на {when}.
escalation_footer: "Пока ответа нет, можно посмотреть базу знаний в разделе «Помощь»."
invalid_answer:
  scale: "Нужно число от 1 до 10 — просто отправьте цифру."
  choice: "Выберите один из вариантов кнопкой под вопросом."
  open: "Напишите ответ текстом — одной фразы достаточно."
button_hint: "Здесь нужен выбор кнопкой — нажмите один из вариантов под сообщением."
not_understood: >-
  Не понял сообщение. Напишите вопрос словами — я найду ответ в базе знаний или передам его HR.

searching: "Секунду, ищу ответ в базе знаний…"
file_received: >-
  Файл получил. Если это все документы — нажмите «Готово», если нет — пришлите остальные.
source_one: "Источник: {names}"
source_many: "Источники: {names}"
survey_progress: "Вопрос {index} из {total}"
survey_ack: "Записал: {value}"
survey_ack_open: "Записал, спасибо."
survey_skipped: "Пропустил этот вопрос."
stage_progress: "Шаг {index} из {total}."
post_run_benefits: "Какие льготы и бонусы есть в компании?"
