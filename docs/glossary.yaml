# Единственный источник терминов. docs/glossary.md генерируется отсюда:
#   make docs-index
# Правило: код, доки и промпты используют эти слова без синонимов.
# Поле `aliases` перечисляет английские написания из кода и идентификаторов.

- term: "сотрудник"
  aliases: ["employee"]
  definition: "Человек в компании, для которого существует прогон онбординга. Идентификатор — `employee_id`."
  see: ["прогон", "новичок"]

- term: "новичок"
  aliases: ["newcomer"]
  definition: "Сотрудник внутри активного прогона. Роль, а не отдельная сущность."
  see: ["сотрудник", "прогон"]

- term: "рекрутёр"
  aliases: ["recruiter"]
  definition: "Человек, который ведёт прогоны онбординга. Видит только свои прогоны."
  see: ["hr-администратор", "роль доступа"]

- term: "hr-администратор"
  aliases: ["hr_admin"]
  definition: "Человек, который владеет базой знаний, сценариями и всеми прогонами."
  see: ["рекрутёр", "роль доступа"]

- term: "менеджер"
  aliases: ["manager"]
  definition: "Человек, который видит сотрудников одного подразделения: имя подразделения стоит в токене."
  see: ["роль доступа"]

- term: "роль доступа"
  aliases: ["role"]
  definition: "Одно из прав кабинета: `recruiter`, `manager`, `hr_admin`. Проверяется на каждом роуте."
  see: ["кабинет", "скоуп"]

- term: "скоуп"
  aliases: ["scope"]
  definition: "Набор данных, доступных токену: свои прогоны, подразделение или всё."
  see: ["роль доступа", "аудитория"]

- term: "сценарий"
  aliases: ["scenario"]
  definition: "Версионированный онбординг-путь: упорядоченный набор шагов с событиями и таймерами."
  see: ["шаг", "прогон"]

- term: "версия сценария"
  aliases: ["scenario_version"]
  definition: "Целое число. Прогон держит версию, с которой начался; правка сценария не меняет живой прогон."
  see: ["сценарий", "прогон"]

- term: "прогон"
  aliases: ["run"]
  definition: "Исполнение одного сценария одним сотрудником. Ключ — `(employee_id, scenario_id, scenario_version)`."
  see: ["сценарий", "шаг"]

- term: "шаг"
  aliases: ["step"]
  definition: "Узел сценария: сообщение, ожидание, проверка или конечное состояние."
  see: ["сценарий", "состояние шага"]

- term: "состояние шага"
  aliases: ["step_state"]
  definition: "Сохранённая позиция прогона: текущий шаг, момент входа, что уже выполнено."
  see: ["шаг", "прогон"]

- term: "событие"
  aliases: ["event"]
  definition: "Вход, который может двигать прогон: `employee_created`, `message_received`, `button_pressed`, `file_received`, `timeout`."
  see: ["задача", "дедупликация"]

- term: "задача"
  aliases: ["job"]
  definition: "Единица работы воркера, записанная в таблицу `jobs` в одной транзакции с событием."
  see: ["событие", "воркер", "outbox"]

- term: "просроченное напоминание"
  aliases: ["due reminder"]
  definition: "Таймер, срок которого прошёл и который должен стать строкой `outbox`."
  see: ["outbox", "планировщик"]

- term: "документ базы знаний"
  aliases: ["knowledge document"]
  definition: "Файл в `knowledge/` с frontmatter. Единственный разрешённый источник фактов для ответа."
  see: ["фрагмент", "цитата"]

- term: "фрагмент"
  aliases: ["chunk"]
  definition: "Извлекаемая часть одного документа базы знаний. Идентификатор `chunk_id` стабилен между переиндексациями."
  see: ["документ базы знаний", "цитата"]

- term: "цитата"
  aliases: ["citation"]
  definition: "Ссылка из ответа на `chunk_id`, который действительно найден для этого вопроса."
  see: ["фрагмент", "обоснованный ответ"]

- term: "обоснованный ответ"
  aliases: ["grounded answer"]
  definition: "Ответ, каждое фактическое утверждение которого подкреплено цитатой из найденного набора."
  see: ["цитата", "эскалация"]

- term: "эскалация"
  aliases: ["escalation"]
  definition: "Передача вопроса человеку вместе с причиной и стенограммой."
  see: ["дефлексия", "вопрос"]

- term: "дефлексия"
  aliases: ["deflection"]
  definition: "Вопрос, который бот закрыл без человека. Главная продуктовая метрика."
  see: ["эскалация", "вопрос"]

- term: "аудитория"
  aliases: ["audience"]
  definition: "Область доступа документа или фрагмента: `all`, `dept:<имя>`, `hr_only`."
  see: ["документ базы знаний", "скоуп"]

- term: "кейс оценки"
  aliases: ["eval case"]
  definition: "Вопрос с ожидаемым поведением: обязательные факты, обязательные цитаты или обязательная эскалация."
  see: ["золотой набор", "гейт"]

- term: "золотой набор"
  aliases: ["golden set"]
  definition: "Файл `docs/evals/golden.yaml` с кейсами, по которым считается качество ответов."
  see: ["кейс оценки", "гейт"]

- term: "страта"
  aliases: ["stratum"]
  definition: "Группа кейсов одного типа (`fact`, `acl`, `neardup`, `injection`, `unanswerable`, `morphology`). Гейт цитируется по страте только при не меньше 10 кейсах."
  see: ["кейс оценки", "гейт"]

- term: "гейт"
  aliases: ["gate"]
  definition: "Число, которое прогон может не пройти. Нижняя граница Уилсона от закреплённого базового прогона, не вкус."
  see: ["базовый прогон", "страта"]

- term: "базовый прогон"
  aliases: ["baseline"]
  definition: "Зафиксированный прогон, с которым сравнивают новый. Числа из разных базовых прогонов не сравнивают."
  see: ["гейт", "парный бутстрап"]

- term: "парный бутстрап"
  aliases: ["paired bootstrap"]
  definition: "Пересэмплирование одних и тех же кейсов двух прогонов. Даёт дельту и доверительный интервал вместо двух несравнимых чисел."
  see: ["базовый прогон", "гейт"]

- term: "измерение"
  aliases: ["measurement"]
  definition: "Файл в `docs/measurements/` с командой, окружением, коммитом и числами. Одно событие — один файл."
  see: ["гейт", "базовый прогон"]

- term: "api"
  aliases: ["api process"]
  definition: "Процесс, который принимает вебхуки, проверяет подпись, ставит события в очередь и обслуживает admin API. Модель не вызывает."
  see: ["воркер", "вебхук"]

- term: "воркер"
  aliases: ["worker"]
  definition: "Процесс, который разбирает очередь: переходы сценария, поиск, генерация, отправка, диспетчеризация, тик напоминаний."
  see: ["api", "задача", "outbox"]

- term: "планировщик"
  aliases: ["scheduler"]
  definition: "Цикл внутри воркера: просроченные напоминания превращает в задачи. Отдельного процесса нет."
  see: ["воркер", "просроченное напоминание"]

- term: "outbox"
  aliases: ["outbox table"]
  definition: "Таблица зафиксированной будущей работы. Таймеры и исходящие сообщения — строки, а не спящие задачи."
  see: ["задача", "диспетчер"]

- term: "диспетчер"
  aliases: ["dispatcher"]
  definition: "Компонент воркера: арендует строки `outbox` по каналам и отдаёт их адаптеру канала."
  see: ["outbox", "адаптер канала"]

- term: "аренда"
  aliases: ["lease"]
  definition: "Право диспетчера отправить строку `outbox` в течение срока. Истекла аренда — строку может взять другой воркер."
  see: ["outbox", "диспетчер"]

- term: "адаптер канала"
  aliases: ["channel adapter"]
  definition: "Код одного мессенджера: разбор входящего, отправка, темп. Ядро о мессенджере не знает."
  see: ["канал", "профиль канала", "входной адаптер"]

- term: "канал"
  aliases: ["channel"]
  definition: "Мессенджер как адрес плюс профиль возможностей, а не клиент. По умолчанию включён MAX."
  see: ["адаптер канала", "профиль канала"]

- term: "профиль канала"
  aliases: ["channel profile"]
  definition: "YAML в `apps/api/channel-profiles/`: лимиты отправки, разметка, поддержка кнопок. Проверяется схемой при старте."
  see: ["канал", "разметка"]

- term: "разметка"
  aliases: ["markup"]
  definition: "Формат оформления сообщения у канала: `plain`, `html`, `markdown`. Адаптер переводит в него нейтральный текст."
  see: ["профиль канала", "адаптер канала"]

- term: "входной адаптер"
  aliases: ["ingress"]
  definition: "Часть адаптера канала: превращает payload вебхука в нейтральное событие и отбрасывает мусор."
  see: ["адаптер канала", "вебхук"]

- term: "вебхук"
  aliases: ["webhook"]
  definition: "HTTP-вход канала: `POST /webhook/{channel}`. Отвечает `200` до работы, работа идёт через очередь."
  see: ["api", "событие"]

- term: "дедупликация"
  aliases: ["deduplication", "dedupe"]
  definition: "Отбрасывание повторной доставки по первичному ключу `events`. Одинаковая фраза от двух людей — два разных ответа."
  see: ["событие", "доставка"]

- term: "доставка"
  aliases: ["delivery"]
  definition: "Одна попытка мессенджера принести апдейт. Гарантия at-least-once, поэтому доставки дедуплицируются."
  see: ["дедупликация", "вебхук"]

- term: "профиль модели"
  aliases: ["model profile"]
  definition: "YAML в `apps/api/model-profiles/<роль>/`: модель, конверт, цены, версия. Схема проверяется при старте."
  see: ["роль модели", "конверт"]

- term: "роль модели"
  aliases: ["model role"]
  definition: "Назначение модели: `answer`, `embed`, `rerank`, `classify`, `extract`. Профиль лежит в каталоге роли."
  see: ["профиль модели"]

- term: "конверт"
  aliases: ["envelope"]
  definition: "Параметры вызова модели: `timeout_s`, `max_retries`, `max_tokens`, `temperature`. Живут в профиле, не в коде."
  see: ["профиль модели"]

- term: "профиль извлечения"
  aliases: ["extraction profile"]
  definition: "YAML в `apps/api/model-profiles/extract/`: маршрут, пороги уверенности, движок распознавания."
  see: ["извлечение", "распознавание"]

- term: "извлечение"
  aliases: ["extraction"]
  definition: "Превращение PDF или скана в markdown через адаптер. Идёт в воркере, не в запросе."
  see: ["профиль извлечения", "распознавание"]

- term: "распознавание"
  aliases: ["recognition", "OCR"]
  definition: "Чтение текста с растровых страниц. Включается, только если текстового слоя не хватило."
  see: ["извлечение"]

- term: "индексация"
  aliases: ["indexing"]
  definition: "Запись документа в базу знаний: проверка frontmatter, нарезка на фрагменты, эмбеддинги, запись строк."
  see: ["документ базы знаний", "фрагмент"]

- term: "поиск"
  aliases: ["retrieval"]
  definition: "Три шага: фильтр по аудитории и сроку в SQL, векторный и лексический поиск, слияние рангов, переранжирование."
  see: ["переранжирование", "эмбеддинг"]

- term: "эмбеддинг"
  aliases: ["embedding"]
  definition: "Вектор фрагмента. Ширина задана профилем модели; смена ширины — миграция и переиндексация."
  see: ["поиск", "фрагмент"]

- term: "переранжирование"
  aliases: ["rerank"]
  definition: "Кросс-энкодер поверх слитого списка: оставляет `top 5` для промпта."
  see: ["поиск"]

- term: "слияние рангов"
  aliases: ["reciprocal rank fusion", "RRF"]
  definition: "Объединение векторного и лексического списков по обратным рангам."
  see: ["поиск", "переранжирование"]

- term: "рубрика"
  aliases: ["rubric"]
  definition: "Версионированный файл с вопросами классификатора. Правка формулировки — новая версия, не правка файла."
  see: ["классификатор"]

- term: "классификатор"
  aliases: ["classifier"]
  definition: "Модель с ролью `classify`: получает рубрику и возвращает распределение вероятностей. Метки не выдумывает."
  see: ["рубрика", "риск"]

- term: "риск"
  aliases: ["risk"]
  definition: "Уровень `low`, `medium`, `high` из тона и тегов ответа на опрос. Считается в `core/risk.py`, не моделью."
  see: ["классификатор", "эскалация"]

- term: "кабинет"
  aliases: ["cabinet", "cockpit"]
  definition: "Веб-приложение рекрутёра. Читает admin API, бот его не вызывает."
  see: ["admin API", "роль доступа"]

- term: "admin API"
  aliases: ["admin api"]
  definition: "HTTP-контракт кабинета под `/admin/api/v1`. Версия в пути; несовместимая правка — новый префикс."
  see: ["кабинет", "контракт"]

- term: "контракт"
  aliases: ["contract"]
  definition: "Схема или описание поверхности в `docs/contracts/`. Меняется раньше кода."
  see: ["admin API"]

- term: "вопрос"
  aliases: ["question"]
  definition: "Обращение сотрудника, которое бот не закрыл или закрыл. Строка в кабинете: статус, исполнитель, решение."
  see: ["эскалация", "дефлексия"]

- term: "аудит"
  aliases: ["audit"]
  definition: "Запись действия с актором, временем и результатом. Ошибки и секреты в аудит не попадают."
  see: ["журнал"]

- term: "журнал"
  aliases: ["audit log"]
  definition: "Таблица `audit_log`: кто, что, когда, с каким результатом. Основа доказательств для 152-ФЗ."
  see: ["аудит", "152-ФЗ"]

- term: "152-ФЗ"
  aliases: ["152-fz"]
  definition: "Закон о персональных данных. Требует локализации базы и поручения обработки; доказательства — в `docs/runbooks/152fz-checklist.md`."
  see: ["журнал"]

- term: "совокупная стоимость владения"
  aliases: ["total cost of ownership", "TCO"]
  definition: "Полный счёт пилота: модели, инфраструктура, люди, бумаги и внедрение. Считается `make tco` по ценам и измеренному бюджету токенов."
  see: ["измерение", "профиль модели"]
