name: opencode-deepseek-v4.1-flash
role: answer
description: "Demo only: cross-border, not admissible for personal data (ADR 0030). Answer model on opencode-go; the demo deployment choice (ADR 0025). Prefix cache is billed separately."
family: openai-chat
model: deepseek-v4.1-flash
json_mode: true
max_tokens_field: max_tokens
# The model can reason; an onboarding answer is a lookup, and reasoning tokens are billed as output.
reasoning_effort: none
# Zero, not 0.2: the same question was answered on one run and refused for `no_sources` on another
# (5 of 137 cases flipped), which moves `answer_contains` and `escalation_precision` by provider
# noise. A lookup answer has nothing to be creative about.
temperature: 0.0
# 1600, not 700: the model reasons in the same budget, and a legal question ("сколько дней
# отпуска") burned 700 tokens on thoughts and returned empty content twice in a row on the live
# stand (2026-10-24), which escalated as "unavailable".
max_tokens: 1600
# Reasoning tokens are billed as output, so effort is off and the timeout stays generous: the
# gate is p95 completion <= 8000 ms.
timeout_s: 30.0
max_retries: 1
retry_empty_completion: true
# Prices stay 0 until a provider invoice anchors them. Cost accounting then reports 0, never a guess.
price_input_rub_per_1k: 0.0
price_output_rub_per_1k: 0.0
price_cache_read_rub_per_1k: 0.0
