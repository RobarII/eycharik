# Labeled free-text answers from the survey steps. The label is what the risk radar must see:
# tone plus the topic tags that decide which specialist gets the signal.
#
# Schema (version 2):
#   id                unique, names the failure, never reused after a rewrite
#   text              a sentence a newcomer could plausibly write
#   sentiment         positive | neutral | negative | unknown  (see sentiment-guide.md)
#   tags              0..3 of access manager colleagues workload clarity hr it integration other
#   split             dev (may be used to tune a prompt) | test (locked, never tune on it)
#   expect_escalation the recruiter must be alerted; core/risk.py must return high + recruiter
#   note              optional, why a borderline case is labeled the way it is
#
# Two rules keep the set honest:
#   1. A case is added after a real failure, and never deleted to make a gate pass.
#   2. Questions are phrased the way a newcomer talks, not with the words of a prompt.
version: 2
cases:
