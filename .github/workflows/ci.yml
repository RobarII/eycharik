name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: onboarding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding -d onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://onboarding:onboarding@localhost:5432/onboarding
      ONBOARDING_TEST_DATABASE: postgresql+asyncpg://onboarding:onboarding@localhost:5432/onboarding
      ENVIRONMENT: local
      ADMIN_TOKENS: ci-recruiter:recruiter:rec-1,ci-hr:hr_admin:hr-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrate a fresh database
        run: uv run alembic upgrade head
      - name: Lint, type-check, test, docs
        run: make check
      - name: Run migrations from an empty database again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
