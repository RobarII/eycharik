[project]
name = "onboarding-assistant"
version = "0.1.0"
description = "Onboarding assistant for the MAX messenger"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pypdfium2>=5.14.0",
  "python-multipart>=0.0.32",
  "python-pptx>=1.0.2",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "uvicorn[standard]>=0.31",
]

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.20",
    "rapidocr>=3.10",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs postgres",
  "eval: needs a model provider",
]
# A plain `pytest` must never spend tokens or touch a paid endpoint. Live suites opt in by marker:
# `pytest -m "integration or eval"` (see `make test-live`).
addopts = "-q -m 'not integration and not eval'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "BLE", "ANN", "T20", "PL", "C4", "DTZ", "TID", "PT"]
ignore = ["ANN401", "PLR0913", "PLR2004", "S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/**" = ["S105", "S106", "ANN"]
"apps/api/onboarding/app/db/migrations/**" = ["ANN", "E501"]
"apps/api/onboarding/cli.py" = ["T201"]
"apps/api/onboarding/evals/**" = ["T201"]
"scripts/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["onboarding"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/onboarding"]
mypy_path = "apps/api"
warn_unreachable = true
disallow_any_explicit = false
plugins = []

[[tool.mypy.overrides]]
module = ["pgvector.*", "pypdfium2.*", "rapidocr.*"]
ignore_missing_imports = true
