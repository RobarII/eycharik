version: 2
# Updates arrive as pull requests, so the gate in ci.yml judges them like any other change.
# Grouped by ecosystem: one PR a week per stack beats twenty one-line PRs nobody reads.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
    groups:
      cabinet:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /apps/admin
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
