channel: max
description: "MAX Bot API. Facts and sources: docs/contracts/max-api.md."
max_text_chars: 4000
max_keyboard_rows: 30          # max-api.md: up to 210 buttons in 30 rows
max_buttons_per_row: 7
keyboard_scope: message
supports_image: true
supports_edit: true
markup: none                   # the adapter omits `format`; copy is plain text
messages_per_second: 2         # MAX accepts two messages per second to one dialog
per_chat_per_second: 2
