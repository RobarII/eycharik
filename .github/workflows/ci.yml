name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: onboarding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding -d onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://onboarding:onboarding@localhost:5432/onboarding
      ONBOARDING_TEST_DATABASE: postgresql+asyncpg://onboarding:onboarding@localhost:5432/onboarding
      ENVIRONMENT: local
      ADMIN_TOKENS: ci-recruiter:recruiter:rec-1,ci-hr:hr_admin:hr-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrate a fresh database
        run: uv run alembic upgrade head
      - name: Lint, type-check, test, docs
        run: make lint types arch test docs
      - name: Run migrations from an empty database again
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production compose override
        run: |
          cat > .env.prod <<'ENV'
          IMAGE_PREFIX=ghcr.io/example/onboarding
          TAG=0000000000000000000000000000000000000000
          DOMAIN=example.com
          PUBLIC_URL=https://example.com
          POSTGRES_USER=onboarding
          POSTGRES_PASSWORD=onboarding
          POSTGRES_DB=onboarding
          DATABASE_URL=postgresql+asyncpg://onboarding:onboarding@postgres:5432/onboarding
          ENV
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod config -q
          rm -f .env.prod

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
          - name: admin
            context: apps/admin
            file: apps/admin/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
