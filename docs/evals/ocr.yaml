# OCR-кейсы для `make eval-ocr`.
#
# Каждый кейс рендерится в страницу известным шрифтом, поэтому эталонный текст точный, а замеру не
# нужны картинки в репозитории. Чистый рендер — нижняя планка для движка: он говорит, работают ли
# распознавание и гейт, а не как ведёт себя фотография печатного регламента.
#
# kind:   clean (пока единственный вид; кейс фиксирует, как он отрендерен)
# expect: accepted | rejected (+ reason, один из core.models.RejectionReason)
# lang:   язык профиля; кейс пропускается, если активный профиль читает другой.

- id: clean-regulation
  kind: clean
  lang: ru
  expect: accepted
  text: |
    Правила внутреннего распорядка
    Рабочий день начинается в 9:00 и заканчивается в 18:00.
    Перерыв на обед — с 13:00 до 14:00.
    Отпуск составляет 28 календарных дней в год.

- id: clean-table
  kind: clean
  lang: ru
  expect: accepted
  text: |
    Категория | Дней отпуска
    Основной | 28
    Дополнительный северный | 24
    За ненормированный день | 3

- id: clean-contacts
  kind: clean
  lang: ru
  expect: accepted
  text: |
    Контакты отдела кадров
    Телефон: +7 495 123-45-67
    Почта: hr@example.ru
    Кабинет: 314, третий этаж

# Одно слово: детектор не находит ни одной текстовой области, поэтому страница отклоняется как
# пустая. Любая из причин — отказ, и суть кейса в том, что в корпус ничего не попадает.
- id: single-word
  kind: clean
  lang: ru
  expect: rejected
  reason: empty
  text: |
    Отпуск
