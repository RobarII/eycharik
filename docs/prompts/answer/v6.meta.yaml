notes: >
  Version 5 fixed the blocked question and overcorrected: it refused ten facts whose answer was in
  the context under another wording ("четырнадцать календарных дней" instead of "14 календарных
  дней"), because rule 1 made the model doubt the fact rather than the formulation. Version 6 keeps
  the missing-fact test and separates it from wording: a paraphrase, a number written as a word, or
  a fact split across two fragments is still an answer.
