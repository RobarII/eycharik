server {
    listen 80;
    server_name _;

    # Resolve the API per request: a redeploy can give it a new address, and nginx caches a
    # name resolved at startup forever. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api;
    root /usr/share/nginx/html;
    index index.html;

    # Knowledge uploads are capped at 25 MB by the API; the cabinet proxy must not reject them
    # with its own 1 MB default before the request reaches the API.
    client_max_body_size 26m;

    # The cabinet is one HTML file, one script and one stylesheet. `style-src` also allows inline
    # style attributes, which React writes for progress bars; scripts get no such exemption.
    # `connect-src 'self'` keeps a stray token from leaving the origin.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /admin/api/ {
        proxy_pass http://$api_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;

        # A response that carries a session cookie is never cached by a proxy in front of us.
        add_header Cache-Control "no-store" always;
    }

    location /healthz {
        proxy_pass http://$api_upstream:8000$request_uri;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # The cabinet asks for this to learn whether it is stale; a cached copy would always say
    # "you are current". Same headers as the HTML: a version is not a document, but it is a body.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location /assets/ {
        # Vite fingerprints the file names, so a year-long cache is safe and honest.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
